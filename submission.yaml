submission:
  title: "TrialGuard"                            # REQUIRED — Project display name, e.g., "SmartOps Dashboard"

  problem_statement: >                 # REQUIRED — 1-3 sentences. What problem? Who has it?
    linical research associates (CRAs) and study sponsors lack real-time, consolidated visibility into multi-site clinical trials. This fragmentation delays the detection of protocol deviations and adverse events, compromising patient safety, inflating trial costs, and risking regulatory audit failures

  solution_summary: >                  # REQUIRED — 1-3 sentences. What did you build?
   We built Aegis Clinical, a centralized dashboard that tracks clinical trial data across all sites in real-time. It automatically flags protocol deviations and highlights high-risk sites, allowing research teams to respond instantly and keep the trial safe and compliant.

  key_features:                        # REQUIRED — List 3 to 5 specific features you implemented
    - "Live Dashboard: See all clinical sites and patients in one place."                             # e.g., "Real-time pipeline anomaly detection using watsonx.ai"
    - "Issue Tracking: Automatically catches and flags any rule violations."
    - "Site Risk Scores: Highlights which sites need the most help using color codes."
    - "AI Document Reader: Quickly extracts rules from long medical documents."                         # optional 4th
    -  "Clean Design: Very easy-to-use and professional interface."           # optional 5th

  tech_stack:
    languages: ["Python", "TypeScript"]                      # REQUIRED — e.g., ["Python", "TypeScript"]
    frameworks: ["FastAPI", "React","Tailwind CSS"]                     # e.g., ["FastAPI", "React"]
    ibm_technologies: ["watsonx.ai"]               # e.g., ["watsonx.ai", "IBM Bob", "IBM Cloud Functions"]
    databases: ["NeonDB"]                      # e.g., ["PostgreSQL", "Redis"]
    other: ["Framer Motion"]                          # e.g., ["Docker", "GitHub Actions", "Slack API"]

  what_we_are_most_proud_of: >         # Optional but recommended — guides judges to your best work
   We are most proud of how we seamlessly integrated AI-driven insights into a beautiful, high-performance 'Mission Control' interface. We successfully took complex, data-heavy clinical trial telemetry and distilled it into a clean, minimalist design that reduces cognitive load for researchers, proving that enterprise medical tools can be both powerful and intuitive.

  known_limitations: >                 # Optional but recommended — be honest about gaps
    Authentication is not implemented — the app is open access, not production-ready.
    CAPA and Protocol Rule approvals are persisted in the DB but the Kanban board status transitions (Draft → Pending Review) require a manual page refresh.
    The deviation trend chart on the Executive Dashboard uses hardcoded historical values for Weeks 1–3; only the current week reflects live data.
    Patient count KPI on the dashboard is hardcoded to 100 and does not reflect the actual generated dataset size.
    The app has only been tested on Chrome and may have layout issues on other browsers.

